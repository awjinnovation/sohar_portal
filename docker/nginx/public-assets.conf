# Public images fetched cross-origin by the Flutter web builds (gate web app,
# visitor web): served straight from disk with CORS headers.
#   /storage/*  uploads (spatie medialibrary, tenant logos) = storage/app/public
#   /tenants/*  bundled tenant branding (logos, marks, onboarding images)
#   /images/*   bundled platform images
# The production equivalent of ./server.php (only `php artisan serve` uses it)
# and of config/cors.php, which only sees requests that reach PHP.
#
# Included inside the server block (/etc/nginx/server-opts.d/*.conf). The
# allowed origin comes from $public_cors_origin, rendered at start from
# CORS_ALLOWED_ORIGINS into /etc/nginx/conf.d/public-cors-map.conf by
# /etc/entrypoint.d/20-public-cors.sh.
#
# "^~" stops NGINX from also matching the image's regex locations (asset
# caching, PHP), so only the rules in the snippet apply to these paths.
location ^~ /storage/ {
    include /etc/nginx/snippets/public-asset-cors.conf;
}

location ^~ /tenants/ {
    include /etc/nginx/snippets/public-asset-cors.conf;
}

location ^~ /images/ {
    include /etc/nginx/snippets/public-asset-cors.conf;
}

# Web app manifest (public/landing/site.webmanifest): the image's mime.types
# has no entry for it.
location ~* \.webmanifest$ {
    types { }
    default_type application/manifest+json;
    add_header Cache-Control "public, max-age=86400";
    add_header X-Content-Type-Options nosniff always;
    access_log off;
    try_files $uri =404;
}

# App downloads (public/downloads/*.apk): stable, versionless links handed to
# staff and visitors. Always revalidated, so a new release reaches the same
# URL at once (the CDN in front caches .apk by default otherwise).
location ^~ /downloads/ {
    types {
        application/vnd.android.package-archive apk;
        application/json json;
    }
    default_type application/octet-stream;
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
}

# Flutter web apps hosted with the API: public/app = visitor app ("Suhar
# Festival"), public/gate = gate scanner app ("Mawsim Gate"). Built with
# --base-href /app/ and /gate/ and hash URLs (/app/#/...), so every other path
# under them falls back to the app's index.html. Same origin as the API, so
# no CORS (and a relative redirect, so it stays on https behind the proxy).
# Revalidated on each load (ETag keeps that cheap) so a new release
# reaches browsers at once.
location = /app { absolute_redirect off; return 301 /app/; }
location ^~ /app/ {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri /app/index.html;
}

location = /gate { absolute_redirect off; return 301 /gate/; }
location ^~ /gate/ {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri /gate/index.html;
}

# Apple Pay merchant domain verification (Amwal Pay / PSP). Apple fetches this
# over HTTPS with no redirects allowed. Exact match wins over the image's
# dotfile-deny regex and never reaches PHP.
location = /.well-known/apple-developer-merchantid-domain-association {
    default_type text/plain;
    add_header X-Content-Type-Options nosniff always;
    access_log off;
    try_files $uri =404;
}
