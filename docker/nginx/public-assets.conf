# Public images fetched cross-origin by the Flutter web builds (gate web app,
# visitor web): served straight from disk with CORS headers.
#   /storage/*  uploads (spatie medialibrary, tenant logos) = storage/app/public
#   /tenants/*  bundled tenant branding (logos, marks, onboarding images)
#   /images/*   bundled platform images
# The production equivalent of ./server.php (only `php artisan serve` uses it)
# and of config/cors.php, which only sees requests that reach PHP.
#
# Included inside the server block (/etc/nginx/server-opts.d/*.conf). The
# allowed origin comes from $public_cors_origin, rendered at start from
# CORS_ALLOWED_ORIGINS into /etc/nginx/conf.d/public-cors-map.conf by
# /etc/entrypoint.d/20-public-cors.sh.
#
# "^~" stops NGINX from also matching the image's regex locations (asset
# caching, PHP), so only the rules in the snippet apply to these paths.
location ^~ /storage/ {
    include /etc/nginx/snippets/public-asset-cors.conf;
}

location ^~ /tenants/ {
    include /etc/nginx/snippets/public-asset-cors.conf;
}

location ^~ /images/ {
    include /etc/nginx/snippets/public-asset-cors.conf;
}

# Web app manifest (public/landing/site.webmanifest): the image's mime.types
# has no entry for it.
location ~* \.webmanifest$ {
    types { }
    default_type application/manifest+json;
    add_header Cache-Control "public, max-age=86400";
    add_header X-Content-Type-Options nosniff always;
    access_log off;
    try_files $uri =404;
}
