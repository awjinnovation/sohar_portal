# Body of the public asset locations in public-assets.conf (static files only).

access_log off;
log_not_found off;

# Never executed or served as PHP, nor dotfiles or config / backup files
# (uploads land in /storage/; same file rules as the image's security.conf).
location ~* \.(?:php\d*|phtml|phar)(?:/|$) { deny all; }
location ~ /\. { deny all; }
location ~* (?:#.*#|\.(?:bak|conf|config|dist|inc|ini|log|sh|sql|sw[op])|~)$ { deny all; }

# add_header here replaces the server-level headers, so the relevant
# security header is repeated. An empty $public_cors_origin (origin not in
# CORS_ALLOWED_ORIGINS) sends no Access-Control-Allow-Origin at all.
add_header Access-Control-Allow-Origin  $public_cors_origin always;
add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
add_header Access-Control-Max-Age       86400 always;
add_header Vary                         Origin always;
add_header X-Content-Type-Options       nosniff always;
add_header Cache-Control                "public, max-age=604800";

limit_except GET HEAD OPTIONS { deny all; }

# Preflight
if ($request_method = OPTIONS) {
    add_header Access-Control-Allow-Origin  $public_cors_origin always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Max-Age       86400 always;
    add_header Vary                         Origin always;
    return 204;
}

try_files $uri =404;
