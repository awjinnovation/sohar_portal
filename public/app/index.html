<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Title, description, theme colour, link-preview tags and the loading
       screen colours are written by `dart run tool/apply_tenant.dart <slug>`;
       deploy/gate-web/build.sh adds og:url and absolute image URLs (PUBLIC_URL). -->
  <meta name="description" content="فعاليات مهرجان صحار وتذاكره وخدماته في تطبيق واحد">
  <meta name="theme-color" content="#314F99">

  <!-- Link previews (WhatsApp, X, iMessage, Slack...) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="مهرجان صحار">
  <meta property="og:title" content="مهرجان صحار">
  <meta property="og:description" content="فعاليات مهرجان صحار وتذاكره وخدماته في تطبيق واحد">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta name="twitter:card" content="summary">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="مهرجان صحار">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>مهرجان صحار</title>
  <link rel="manifest" href="manifest.json">

  <!-- Loading screen shown until Flutter draws its first frame (web/splash.js). -->
  <style id="splash-style">
    :root { --splash-from: #314F99; --splash-to: #24397A; }
    html, body { margin: 0; height: 100%; background: var(--splash-from); }
    #splash {
      position: fixed; inset: 0; z-index: 2147483647;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
      background: linear-gradient(135deg, var(--splash-from), var(--splash-to));
      transition: opacity .35s ease;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    #splash .chip {
      width: 112px; height: 112px; border-radius: 28px; background: #fff;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 12px 32px rgba(17, 24, 39, .18);
    }
    #splash .chip img { width: 88px; height: 88px; border-radius: 20px; }
    #splash .bar { width: 120px; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, .25); overflow: hidden; }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%; border-radius: 4px; background: #fff;
      animation: splash-slide 1.1s ease-in-out infinite;
    }
    @keyframes splash-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #splash .bar::after { animation: none; width: 100%; } }
    noscript p { position: fixed; inset: auto 16px 32px; z-index: 2147483647; margin: 0; text-align: center;
      color: #fff; font: 16px/1.6 system-ui, sans-serif; }
  </style>
  <script src="splash.js?v=e73bd8346b93"></script>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <div class="chip"><img src="icons/Icon-192.png" alt=""></div>
    <div class="bar"></div>
  </div>
  <noscript><p>يتطلّب هذا التطبيق تفعيل JavaScript في المتصفح. · This app needs JavaScript enabled.</p></noscript>
  <script src="flutter_bootstrap.js?v=e73bd8346b93" async></script>
</body>
</html>
